- id: vdem-44
  kind: source
  evidence:
    citation_id: vdem2026
    locator: Key findings
    verified: true
    verification_note: 'Report PDF retrieved from v-dem.net: "Nearly a quarter of the worlds nations are
      now on the list of autocratizers: 44 countries" and "A record of 41% (3.4 billion) of the world
      population currently reside in autocratizing countries."'
  passage: The V-Dem Institute's 2026 report counts 44 countries, holding about 41 percent of the world's
    population, in some phase of autocratization, and earlier work on the same data found that once autocratization
    begins inside a democracy, only about one in five democracies recover [@vdem2026; @boese2021].
- id: boese-one-in-five
  kind: source
  evidence:
    citation_id: boese2021
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1080/13510347.2021.1891413; abstract (OpenAlex): once autocratization begins,
      only one in five democracies manage to avert breakdown.'
  passage: The V-Dem Institute's 2026 report counts 44 countries, holding about 41 percent of the world's
    population, in some phase of autocratization, and earlier work on the same data found that once autocratization
    begins inside a democracy, only about one in five democracies recover [@vdem2026; @boese2021].
- id: bermeo-aggrandizement
  kind: source
  evidence:
    citation_id: bermeo2016
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1353/jod.2016.0012; Crossref abstract: executive aggrandizement and strategic
      electoral manipulation are increasing while open-ended coups decline.'
  passage: The usual mode of attack is executive aggrandizement, the incremental and legalistic capture
    of the referees, proceeding in steps each too small to trigger a response [@bermeo2016; @levitsky2018;
    @ginsburg2018].
- id: besley-capacity
  kind: source
  evidence:
    citation_id: besley2009
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1257/aer.99.4.1218; Crossref abstract: policy is constrained by past investments
      in legal and fiscal capacity, with political stability conducive to building it.'
  passage: The state-capacity literature treats capacity as a forward-looking investment whose value depends
    on who will hold power next [@besley2009; @besley2011]; the reset tax describes that investment when
    the holder changes on a schedule and the handover loses part of it.
- id: alesina-successors
  kind: source
  evidence:
    citation_id: alesina1990
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.2307/2298021; abstract (OpenAlex): alternating policymakers use debt strategically
      to influence the choices of their successors.'
  passage: A successor-only rule, under which a majority that changes the rules of competition cannot
    itself benefit from the change, removes the immediate payoff from constitutional self-dealing, the
    means by which a strategic incumbent binds its successors [@alesina1990; @venice2002].
- id: fearon-signal
  kind: source
  evidence:
    citation_id: fearon2011
    locator: Abstract
    verified: true
    verification_note: 'DOI 10.1093/qje/qjr038; abstract (OpenAlex): elections provide a public signal
      for coordinating rebellion, and a party system in which today''''s losers may win in the future
      restores self-enforcing democracy.'
  passage: Democracy is self-enforcing only while the losers of an election expect to compete again, and
    the public, common-knowledge signal an election provides lets citizens coordinate to defend it [@fearon2011;
    @przeworski2010].
- id: reset-tax-def
  kind: definition
  rationale: Names the central quantity lambda times chi, which follows from the expected-value equation
